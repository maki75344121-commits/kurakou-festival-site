<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文化祭 得点ランキング (閲覧用)</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1p:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fff9f0;
            font-family: 'M PLUS Rounded 1p', sans-serif;
            color: #4a2e18;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #d35400;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #f39c12;
        }
        .rank {
            font-size: 1.2rem;
            font-weight: bold;
            color: #d35400;
        }
        .name {
            font-size: 1.5rem;
            font-weight: 900;
        }
        .score {
            font-size: 1.8rem;
            font-weight: 900;
            color: #8e44ad;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎃 得点ランキング 👻</h1>
        <div id="ranking-list">読み込み中...</div>
    </div>

    <!-- Firebaseのプログラムを読み込む -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // 👇 ここにFirebaseの「設定コード」を貼り付けてね
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAqX5muWooowyYzQ3HCG0tJQt9SN3EaJKo",
            authDomain: "kurako-festival-ranking.firebaseapp.com",
            projectId: "kurako-festival-ranking",
            storageBucket: "kurako-festival-ranking.firebasestorage.app",
            messagingSenderId: "674147684775",
            appId: "1:674147684775:web:fa1170b21b652b16eae682"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const listEl = document.getElementById("ranking-list");

        // データベースの「scores」という場所を監視して、得点順(desc)に並び替える
        const q = query(collection(db, "scores"), orderBy("score", "desc"));

        onSnapshot(q, (snapshot) => {
            let html = "";
            let rank = 1;
            snapshot.forEach((doc) => {
                const data = doc.data();
                html += `
                    <div class="card">
                        <div class="rank">${rank}位</div>
                        <div class="name">${data.name}</div>
                        <div class="score">${data.score} pt</div>
                    </div>
                `;
                rank++;
            });
            if(html === "") {
                html = "<p style='text-align:center;'>データがまだありません。管理画面から追加してください。</p>";
            }
            listEl.innerHTML = html;
        });
    </script>
</body>
</html>
